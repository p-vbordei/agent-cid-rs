[package]
name = "agent-cid"
version = "0.1.0"
edition = "2021"
authors = ["Vlad Bordei <bordeivlad@gmail.com>"]
description = "Content-addressed artifact manifest for AI agents (Rust port of @p-vbordei/agent-cid)"
license = "Apache-2.0"
repository = "https://github.com/p-vbordei/agent-cid-rs"
readme = "README.md"
keywords = ["agent", "cid", "ed25519", "did", "manifest"]
categories = ["cryptography", "data-structures"]

[dependencies]
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
rand = "0.8"
sha2 = "0.10"
bs58 = "0.5"
data-encoding = "2.6"
base64 = "0.22"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
serde_jcs = "0.1"
chrono = { version = "0.4", default-features = false, features = ["std", "serde", "clock"] }
thiserror = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
once_cell = "1.19"
futures = "0.3"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
